name: Build Linglong Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 leg must run on a native arm64 runner, otherwise the UAB would be
    # an x86_64 package despite the arm64 config
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # 官方 action 引用的 xUbuntu_24.04 源已 404，这里用现存的 Ubuntu_24.04 flat 源
      - name: Install linglong-builder
        run: |
          echo "deb [trusted=yes] https://ppa.linyaps.org.cn/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder linglong-box

      # stable 通道的 x86_64 builder-utils (0.0.2.0) 不完整且低于 1.14.0 要求的
      # 0.0.4.0，UAB 导出必失败；dev 通道有完整可用的 0.0.4.0
      #- name: Switch repo to dev channel
      #  run: |
      #    ll-builder repo show
      #    ll-builder repo add dev https://mirror-repo-linglong.deepin.com
      #    ll-builder repo set-default dev
      #    ll-builder repo show

      - name: Build (${{ matrix.arch }})
        run: |
          ll-builder --version
          ll-builder build -f ${{ matrix.arch }}/linglong.yaml

      - name: Export UAB (${{ matrix.arch }})
        run: |
          ll-builder export -f ${{ matrix.arch }}/linglong.yaml

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: uab-${{ matrix.arch }}
          path: ./*.uab

      - name: Release (${{ matrix.arch }})
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.uab
          generate_release_notes: true
