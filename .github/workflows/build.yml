name: Build Linglong Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 官方 action 引用的 xUbuntu_24.04 源已 404，这里用现存的 Ubuntu_24.04 flat 源
      - name: Install linglong-builder
        run: |
          echo "deb [trusted=yes] https://ppa.linyaps.org.cn/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder linglong-box

      # stable 通道的 x86_64 builder-utils (0.0.2.0) 不完整且低于 1.14.0 要求的
      # 0.0.4.0，UAB 导出必失败；dev 通道有完整可用的 0.0.4.0
      - name: Switch repo to dev channel
        run: |
          ll-builder repo show
          ll-builder repo add dev https://mirror-repo-linglong.deepin.com
          ll-builder repo set-default dev
          ll-builder repo show

      - name: Build
        run: |
          ll-builder --version
          ll-builder build

      - name: Export UAB
        run: ll-builder export

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uab
          path: ./*.uab

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.uab
          generate_release_notes: true
